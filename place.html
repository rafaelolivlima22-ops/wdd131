<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WDD 131 - Dynamic Web Fundamentals - Rafael</title>

    <meta name="description" content="WDD 131 -Dynamic Web Fundamentals - Rafael Oliveira de Lima">

    <meta name="author" content="Rafael Oliveira de Lima">

    <script src="scripts/place.js" defer></script>

      <link rel="stylesheet" href="styles/place.css">

</head>

<body>

    <header>
        <h1>Brazil</h1>
    </header>

    <main>
    <picture class="hero-picture">
        <source media="(min-width: 601px)" srcset="images/brazilwaterfall.webp">
        <img src="images/brazilwaterfall.webp" alt="A beautiful view of Iguazu Falls in Brazil" class="hero-image">
    </picture>

    <div class="info-grid">
    <section>
        <h2>Data</h2>

        <p><span>Area</span><span>8,510,417 km²</span></p>
        <p><span>Population</span><span>213.4 million people</span></p>
        <p><span>Capital</span><span>Brasilia</span></p>
        <p><span>Languages</span><span>Portugues</span></p>
        <p><span>Currency</span><span>Sao Paulo</span></p>
        <p><span>Time Zone</span><span>UTC-3</span></p>
        <p><span>Calling Code</span><span>+55</span></p>
        <p><span>Internet TLD</span><span>.br</span></p>
    </section>

    <section>
         <h2>Weather</h2>
        <img src="images/weather.svg" alt="Weather icon showing sun, clouds, and rain" class="weather-icon">
        <span class="weather-emoji" aria-hidden="true">⛅</span>

        <p><span>Temperature</span><span id="temperature" data-celsius="20">20°C</span></p>
        <p><span>Conditions</span><span>Mostly Cloudy</span></p>
        <p><span>Wind</span><span id="wind-speed" data-kph="29">Up to 29 km/h</span></p>
        <p><span>Wind Chill</span><span id="wind-chill">N/A</span></p>
    </section>
</div>
    

    </main>

  <footer>
    2026 😀 Rafael Oliveira de Lima 😀
Brazil </footer>
</body>
</html>
