<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temple Album</title>

    <meta name="description" content="A responsive picture album of temples.">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/temples.css">

    <link rel="stylesheet" href="styles/temples-large.css">

    <script src="scripts/temples.js" defer></script>

</head>
<body>
    <header>
        <h2>Temple Album</h2>

        <button id="menu" aria-label="Toggle navigation menu" aria-expanded="false">&#9776;</button>

        <nav>
            <a href="#">Home</a>
            <a href="#">Old</a>
            <a href="#">New</a>
            <a href="#">Large</a>
            <a href="#">Small</a>
        </nav>

    </header>

    <main>
        <h1>Home</h1>
        

        <section class="gallery">

            <figure>
                <img src="images/images/alberta.jpg" alt="alberta temple" loading="lazy" width="400" height="250">
                <figcaption>Alberta</figcaption>
            </figure>

            <figure>
                <img src="images/images/durbansouthafricatemple72674main.jpg" alt="Durban South Africa Temple" loading="lazy" width="400" height="250">
                <figcaption>Durban South Africa</figcaption>
            </figure>

            <figure>
                <img src="images/images/idahotemple.jpg" alt="Idaho Temple" loading="lazy" width="400" height="250">
                <figcaption>Idaho</figcaption>
            </figure>
            <figure>

                <img src="images/images/parisfrancetemple2056main.jpg" alt="Paris France Temple" loading="lazy" width="400" height="250">
                <figcaption>Paris France</figcaption>
            </figure>

            <figure>
                <img src="images/images/saltlaketemple.jpg" alt="Salt Lake Temple" loading="lazy" width="400" height="250">
                <figcaption>Salt Lake Utah</figcaption>
            </figure>

            <figure>
                <img src="images/images/SaoPauloBrazilTemple1.jpg" alt="Sao Paulo Brazil Temple" loading="lazy" width="400" height="250">
                <figcaption>Sao Paulo Brazil</figcaption>
            </figure>
            
            <figure>
                <img src="images/images/campinastemple.jpg" alt="Campinas Brazil Temple" loading="lazy" width="400" height="250">
                <figcaption>Campinas Brazil</figcaption>
            </figure>

            <figure>
                <img src="images/images/TemploFortalezaEXT4WEB.png" alt="Fortaleza Brazil Temple" loading="lazy" width="400" height="250">
                <figcaption> Fortaleza Brazil</figcaption>
            </figure>

            <figure>
                <img src="images/images/torontoontariotemple57469main.jpg" alt="Toronto Ontario Temple" loading="lazy" width="400" height="250">
                <figcaption>Toronto Ontario</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> 😀 Rafael Oliveira de Lima 😀 Brazil</p>
        <p>Last Modification: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
